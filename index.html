<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Steps &amp; Sleep</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header>
      <h1>Steps &amp; Sleep</h1>
      <p id="status" class="subtitle">Upload two CSV files to see the charts. Each file gets its own line chart, and the third chart plots one against the other.</p>
    </header>

    <section class="card upload" aria-label="Upload data">
      <label class="upload-field">
        <span>First CSV (e.g. steps)</span>
        <input id="file-a" type="file" accept=".csv,text/csv">
      </label>
      <label class="upload-field">
        <span>Second CSV (e.g. sleep)</span>
        <input id="file-b" type="file" accept=".csv,text/csv">
      </label>
      <div class="examples">
        <span>Or try an example:</span>
        <button type="button" data-a="data/DATA - Step Count.csv" data-b="data/DATA - Hours of Sleep.csv">Steps &amp; sleep</button>
        <button type="button" data-a="data/examples/quiz_scores.csv" data-b="data/examples/study_hours.csv">Study hours &amp; quiz scores</button>
        <button type="button" data-a="data/examples/ice_cream_sales.csv" data-b="data/examples/temperature.csv">Temperature &amp; ice cream</button>
        <button type="button" data-a="data/examples/sleep_roommates.csv" data-b="data/examples/screen_time.csv">Screen time &amp; sleep</button>
        <!-- testing button -->
        <button type="button" data-a="data/testcases/duplicate-names-sleep.csv" data-b="data/testcases/duplicate-names-steps.csv">Sleep &amp; Steps</button> 
        <!-- -->
      </div>
      <ul id="warnings" class="warnings" hidden></ul>
    </section>

    <!-- Hidden until both files load successfully. -->
    <div id="charts" hidden>
      <!-- Sticky, so the renderer can be switched while looking at any of the charts. -->
      <div class="chart-settings">
        <div class="renderer-toggle" role="group" aria-label="Chart renderer">
          <span>Render charts with:</span>
          <button type="button" id="renderer-canvas" data-renderer="canvas" aria-pressed="true">Canvas</button>
          <button type="button" id="renderer-svg" data-renderer="svg" aria-pressed="false">SVG</button>
        </div>
      </div>
      <p class="chart-settings-note">Same charts, drawn two ways: Canvas paints pixels, SVG builds shapes you can inspect.</p>
      <section id="chart-a" class="card"></section>
      <section id="chart-b" class="card"></section>
      <section id="chart-scatter" class="card"></section>
    </div>
  </main>

  <!-- src/data.js imports 'papaparse' by name; this tells the browser where to find it (no build step). -->
  <script type="importmap">
    { "imports": { "papaparse": "https://cdn.jsdelivr.net/npm/papaparse@5.7.0/+esm" } }
  </script>
  <!-- ES modules don't load from file:// — run `npx serve` in this folder. -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
