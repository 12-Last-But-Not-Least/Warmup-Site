name: End-to-end tests

on:
  pull_request:
  push:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Downloads the Chromium browser Playwright drives, plus the Linux libraries it needs.
      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      # On failure, keep the HTML report (screenshots and traces) to download from the run page.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
